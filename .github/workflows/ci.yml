name: CI

# Runs the backend test suite (pytest) on every pull request and on every
# push to main. Make the "Tests (Python 3.12)" check required in the branch
# protection rules of main, so nothing is merged without passing it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q